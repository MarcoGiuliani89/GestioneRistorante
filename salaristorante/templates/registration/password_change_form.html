{% extends 'base.html' %}
{% load django_bootstrap5 %}

{% block title %}Modifica Password{% endblock title %}

{% block content %}
<h4>Modifica password</h4>
<h6 class="card-title">Inserisci la password attuale, poi la nuova password e la conferma</h6>

<div class="row row-cols-1 row-cols-lg-2 g-4 mt-2 mb-4">
    <div class="col">
        <div class="card h-100">
            <form class="" method="POST" novalidate>
                <div class="card-body">
                    {% csrf_token %}
                    {% bootstrap_form form %}
                </div>
                <div class="card-footer">
                    <input type="submit" value="Modifica password" class="btn btn-primary my-2 me-2">
                    <a href="/" class="btn btn-light my-2">Annulla</a>
                </div>
            </form>
        </div>
    </div>
</div>

{% endblock content %}
