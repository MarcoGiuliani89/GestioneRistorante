{% extends 'base.html' %}
{% load django_bootstrap5 %}
{% load bootstrap_icons %}
{% load static %}



{% block title %}
Upload Ospiti  
{% endblock %}
    

{% block content %}
<div class="d-flex">
    <div class="me-auto d-flex">
        <h4>Upload ospiti</h4>
    </div>
</div>

<form id="uploadForm" enctype="multipart/form-data" class="mt-4">
    <input type="file" name="file" id="fileInput" class="form-control">
    <button type="submit" class="btn btn-primary mt-2">Carica</button>
</form>

<div class="table-responsive mt-4" id="previewContainer" style="display: none;">
    <table class="table table-bordered table-sm" id="previewTable">
        <thead class="table-light">
            <tr id="selectRow"></tr>
            <tr id="tableHeader">
                <th>#</th>
            </tr>
        </thead>
        <tbody id="tableBody">
        </tbody>
    </table>
</div>

<div id="rawOutput" class="mt-4" style="display: none;">
    <h6>Anteprima grezza (debug)</h6>
    <pre id="output"></pre>
</div>

{% endblock content %}


{% block extra_js %}
<script>
    const url_importa_ospiti = '{% url "importa_ospiti" %}';
    const url_mappatura = '{% url "api_excel_mapping" %}';
    const csrf_token = '{{csrf_token}}';
</script>
<script src="{% static 'js/upload_ospiti_lettura.js' %}"></script> 
{% endblock %}
